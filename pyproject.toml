[project]
name = "voice-blueprint"
version = "0.1.0"
description = "Reference implementation: scheduler + TAC agent-connect + event-ingestor + wallboard + test-harness on Twilio."
requires-python = ">=3.11"

[tool.uv.workspace]
members = [
    "shared",
    "apps/scheduler",
    "apps/agent_connect",
    "apps/event_ingestor",
]

[tool.uv.sources]
voice-blueprint-shared = { workspace = true }
scheduler = { workspace = true }
agent-connect = { workspace = true }
event-ingestor = { workspace = true }

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "httpx>=0.27",
]
provision = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["scheduler", "event_ingestor", "agent_connect"]
omit = [
    # The entrypoint lifespan hooks + Twilio-shaped integrations are
    # exercised in dev + staging, not in unit tests.
    "*/main.py",
    "*/handlers/outbound.py",
    "*/outbound/agent_client.py",
    "*/outbound/upstream.py",
    "*/outbound/notify.py",
    "*/http/callbacks.py",
    "*/worker/loop.py",
    "*/tools/__init__.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
