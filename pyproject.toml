[project]
name = "voice-blueprint"
version = "0.1.0"
description = "Reference implementation: scheduler + TAC agent-connect + event-ingestor + wallboard + test-harness on Twilio."
requires-python = ">=3.11"

[tool.uv.workspace]
members = [
    "shared",
    "apps/scheduler",
    "apps/agent_connect",
    "apps/event_ingestor",
]

[tool.uv.sources]
voice-blueprint-shared = { workspace = true }
scheduler = { workspace = true }
agent-connect = { workspace = true }
event-ingestor = { workspace = true }

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
