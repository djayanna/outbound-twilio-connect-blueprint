version: 2
updates:
  # GitHub Actions — keeps SHA-pinned uses: refs current.
  # When Dependabot opens a bump PR, it updates both the SHA and the
  # trailing `# vX.Y.Z` comment so the Semgrep rule
  # (github-actions-mutable-action-tag) stays satisfied.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Pin to SHAs — never regress to `@v4` on an auto-bump.
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"

  # Python workspace — uv.lock + root pyproject + each app's pyproject.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"

  # Vite UIs — one entry each so updates land scoped to the owning package.
  - package-ecosystem: "npm"
    directory: "/apps/test_harness"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "test-harness"
  - package-ecosystem: "npm"
    directory: "/apps/wallboard"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "wallboard"

  # Docker base images (python:3.11-slim, node:20-alpine, nginx:1.27-alpine).
  - package-ecosystem: "docker"
    directories:
      - "/apps/scheduler"
      - "/apps/agent_connect"
      - "/apps/event_ingestor"
      - "/apps/test_harness"
      - "/apps/wallboard"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"
