name: ci

# All third-party action references are pinned to full 40-char commit SHAs
# (not tags) so a compromised or retargeted tag cannot execute attacker code
# in this workflow. The trailing comment is the human-readable version each
# SHA corresponds to — bump both when upgrading. Resolve a new SHA with:
#
#   gh api repos/<owner>/<repo>/git/refs/tags/<tag> --jq '.object.sha'
#
# (if the tag is annotated, deref via /git/tags/<sha>).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.11
      - name: Install workspace
        run: uv sync --all-packages --group dev
      - name: Lint
        run: uv run ruff check apps shared scripts tests
      - name: Test + coverage gate
        run: uv run --all-packages pytest --cov

  ui:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [test_harness, wallboard]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json
      - name: Install
        run: npm --prefix apps/${{ matrix.app }} ci
      - name: Build
        run: npm --prefix apps/${{ matrix.app }} run build
