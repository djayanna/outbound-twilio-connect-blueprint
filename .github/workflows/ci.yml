name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.11
      - name: Install workspace
        run: uv sync --all-packages --group dev
      - name: Lint
        run: uv run ruff check apps shared scripts tests
      - name: Test + coverage gate
        run: uv run --all-packages pytest --cov

  ui:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [test_harness, wallboard]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json
      - name: Install
        run: npm --prefix apps/${{ matrix.app }} ci
      - name: Build
        run: npm --prefix apps/${{ matrix.app }} run build
