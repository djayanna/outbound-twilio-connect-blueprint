name: docker

# All third-party action references are pinned to full 40-char commit SHAs.
# See .github/workflows/ci.yml for the rationale + the resolve recipe.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: scheduler
            dockerfile: apps/scheduler/Dockerfile
          - name: agent-connect
            dockerfile: apps/agent_connect/Dockerfile
          - name: event-ingestor
            dockerfile: apps/event_ingestor/Dockerfile
          - name: test-harness
            dockerfile: apps/test_harness/Dockerfile
          - name: wallboard
            dockerfile: apps/wallboard/Dockerfile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          tags: ${{ matrix.name }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
