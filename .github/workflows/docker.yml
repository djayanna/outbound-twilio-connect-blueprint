name: docker

# All third-party action references are pinned to full 40-char commit SHAs.
# See .github/workflows/ci.yml for the rationale + the resolve recipe.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: scheduler
            dockerfile: apps/scheduler/Dockerfile
          - name: agent-connect
            dockerfile: apps/agent_connect/Dockerfile
          - name: event-ingestor
            dockerfile: apps/event_ingestor/Dockerfile
          - name: test-harness
            dockerfile: apps/test_harness/Dockerfile
          - name: wallboard
            dockerfile: apps/wallboard/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0
      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          tags: ${{ matrix.name }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
