version: "3"
# authtoken is read from NGROK_AUTHTOKEN or from your global config at
# ~/Library/Application Support/ngrok/ngrok.yml (ngrok 3 falls back to it).
# Older examples show `agent: { authtoken_from_env: true }`; ngrok 3 does
# not recognize that key and will refuse to start — omit entirely.
tunnels:
  # agent-connect — serves inbound TwiML, ConversationRelay WebSocket,
  # SMS webhook, call-event callbacks. Points to TWILIO_VOICE_PUBLIC_DOMAIN.
  agent-connect:
    addr: 3002
    proto: http
  # scheduler — receives per-call statusCallback from Twilio.
  # Points to SCHEDULER_PUBLIC_URL.
  scheduler:
    addr: 3001
    proto: http
  # event-ingestor — Twilio Event Streams webhook sink target.
  # Points to EVENT_INGESTOR_PUBLIC_URL.
  event-ingestor:
    addr: 3003
    proto: http
