[project]
name = "agent-connect"
version = "0.1.0"
description = "TAC application: inbound SMS + ConversationRelay voice + outbound conversation creation."
requires-python = ">=3.11"
dependencies = [
    "voice-blueprint-shared",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "twilio>=9.8.3",
    "openai>=1.50",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_connect"]
