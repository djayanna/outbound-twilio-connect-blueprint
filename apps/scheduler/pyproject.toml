[project]
name = "scheduler"
version = "0.1.0"
description = "Scheduler service: owns Jobs, JobRuns, policy, and audit.db."
requires-python = ">=3.11"
dependencies = [
    "voice-blueprint-shared",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pytz>=2024.1",
    "python-multipart>=0.0.9",
    "twilio>=9.8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scheduler"]
