[project]
name = "event-ingestor"
version = "0.1.0"
description = "Twilio Event Streams webhook sink. Validates, dedupes, fans out, writes audit."
requires-python = ">=3.11"
dependencies = [
    "voice-blueprint-shared",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "twilio>=9.8.3",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/event_ingestor"]
